<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FruitFly · 3D 場景</title>
<style>
:root{color-scheme:dark;--accent:#d7f58a;--muted:#b2bda9}*{box-sizing:border-box}body{margin:0;background:#101813;color:#e8ebdb;font-family:"Avenir Next","PingFang TC",sans-serif;overflow:hidden}#scene{position:absolute;inset:0}header{position:absolute;top:25px;left:28px;right:28px;pointer-events:none;text-shadow:0 2px 12px #000}a,button,select{pointer-events:auto;color:inherit;font:inherit}a{text-underline-offset:4px}h1{font-size:29px;letter-spacing:-.04em;font-weight:500;margin:10px 0}header p{font-size:12px;line-height:1.7;margin:0;max-width:660px}.nav{display:flex;align-items:center;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--accent)}[hidden]{display:none!important}select,button{background:#132018dc;border:1px solid #d7e4c355;padding:10px;font-size:12px}button{cursor:pointer}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#status{font-size:11px;color:var(--muted);margin-top:12px;max-width:650px}#status.error{color:#ffbc96}.bottom{position:absolute;bottom:18px;left:20px;right:20px;background:#0c160fe8;border:1px solid #d7e4c338;padding:17px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}.meta{font-size:11px;color:var(--muted);line-height:1.7;max-width:420px}.meta b{font-weight:500;color:#e8ebdb;font-size:15px}.controls{display:flex;gap:7px;flex-wrap:wrap}.help{margin-left:auto;font-size:10px;color:var(--muted)}button:disabled{opacity:.4;cursor:wait}#notice{font-size:11px;color:var(--muted);line-height:1.7;margin-top:8px;max-width:680px}#fallback{display:none}#fallback.visible{display:block}@media(max-width:700px){header{top:18px;left:18px;right:18px}h1{font-size:24px}.bottom{left:10px;right:10px;bottom:10px;padding:12px;gap:10px}.help{display:none}.meta{width:100%;font-size:10px}.controls button{padding:8px;font-size:11px}#notice{max-width:95%;font-size:10px}}
</style><script type="importmap">{"imports":{"three":"./lib/three.module.js","gaussian":"./lib/gaussian-splats-3d.module.js"}}</script></head><body>
<main id="scene" aria-label="可旋轉、平移及縮放的 3DGS 場景"></main><header><nav class="nav"><a href="index.html">← 返回實驗紀錄</a><label for="scene-select">場景 <select id="scene-select"><option value="hall">原有工廠</option><option value="dajing">Dajing 校園</option></select></label><label id="quality-label" hidden for="quality">畫質 <select id="quality"></select></label><button id="fullscreen" type="button">全螢幕 ↗</button></nav><h1 id="title">3D Gaussian Splatting</h1><p id="subtitle">載入場景資料…</p><div id="status" role="status">準備互動檢視…</div><p id="notice"></p><p id="fallback"><a id="fallback-link" target="_blank" rel="noreferrer">開啟作者原始場景頁 ↗</a></p></header>
<section class="bottom" aria-label="場景控制"><div class="meta"><b id="size">—</b><br><a id="source" target="_blank" rel="noreferrer">場景來源</a> · <span id="license"></span></div><div id="views" class="controls"></div><div class="help">左鍵／單指拖動旋轉 · 右鍵平移 · 滾輪／雙指縮放<br><span id="coordinates"></span></div></section>
<script type="module">
import * as GS from 'gaussian';
const el=id=>document.getElementById(id),status=el('status');
const params=new URLSearchParams(location.search),sceneId=params.get('scene')==='dajing'?'dajing':'hall';el('scene-select').value=sceneId;el('scene-select').onchange=()=>{const url=new URL(location.href);url.search='';url.searchParams.set('scene',el('scene-select').value);location.href=url.href};el('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{status.textContent='全螢幕暫時不可用'});
try{const response=await fetch('data/scenes.json');if(!response.ok)throw Error('無法讀取場景資料');const entries=(await response.json()).scenes,entry=entries.find(s=>s.id===sceneId);if(!entry)throw Error('未找到場景');el('title').textContent=entry.label;el('subtitle').textContent=entry.caption;el('notice').textContent=entry.note;el('size').textContent=`${entry.splats.toLocaleString()} 粒 Gaussian · ${(entry.bytes/1e6).toFixed(2)} MB`;el('source').textContent=entry.attribution;el('source').href=entry.source_url;el('license').textContent=entry.licence;el('fallback-link').href=entry.source_url;
const variant=entry.variants?.find(v=>v.id===params.get('quality'))||entry.variants?.[0];if(variant){el('quality-label').hidden=false;el('quality').replaceChildren(...entry.variants.map(v=>new Option(v.label,v.id)));el('quality').value=variant.id;el('quality').onchange=()=>{const next=new URL(location.href);next.searchParams.set('quality',el('quality').value);location.href=next.href};el('size').textContent=`${variant.splats.toLocaleString()} 粒 Gaussian · ${(variant.bytes/1e6).toFixed(2)} MB`;if(variant.id==='full')el('notice').textContent='完整密度 900 萬粒 · 288 MB · 建議電腦及充足記憶體。SH0 顏色／旋轉已量化；比例及碰撞未校準，尚未訓練。'}
const views=entry.views,requested=Number(params.get('view')||0),initial=Number.isInteger(requested)&&requested>=0&&requested<views.length?requested:0;
const buttons=views.map((v,i)=>{const b=document.createElement('button');b.textContent=v.label;b.dataset.view=i;b.disabled=true;return b});el('views').replaceChildren(...buttons);status.textContent=`正在下載及處理 ${((variant?.bytes||entry.bytes)/1e6).toFixed(2)} MB 場景…`;
const viewer=new GS.Viewer({rootElement:el('scene'),cameraUp:entry.camera_up,initialCameraPosition:views[initial].position,initialCameraLookAt:views[initial].target,sharedMemoryForWorkers:false,gpuAcceleratedSort:false,integerBasedSort:false,sphericalHarmonicsDegree:0,antialiased:true,ignoreDevicePixelRatio:true,renderMode:GS.RenderMode.OnChange});
if(variant?.assets.length>1){await viewer.addSplatScenes(variant.assets.map(path=>({path,splatAlphaRemovalThreshold:0})),true)}else{await viewer.addSplatScene(variant?.assets[0]||entry.asset,{splatAlphaRemovalThreshold:1,showLoadingUI:true,progressiveLoad:false})};if(sceneId==='dajing'){viewer.camera.near=.001;viewer.camera.updateProjectionMatrix()}viewer.start();status.textContent='場景已載入 · 可旋轉、平移及縮放';buttons.forEach((b,i)=>{b.disabled=false;b.onclick=()=>{viewer.camera.position.set(...views[i].position);viewer.camera.up.set(...entry.camera_up);viewer.camera.lookAt(...views[i].target);viewer.controls.target.set(...views[i].target);viewer.controls.update()}});setInterval(()=>{const p=viewer.camera.position;el('coordinates').textContent=`相機 xyz: ${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}`},500);
}catch(error){status.className='error';status.textContent=`載入失敗：${error.message}。可返回首頁睇影片，或開啟作者原始來源。`;el('fallback').className='visible';console.error(error)}
</script></body></html>
